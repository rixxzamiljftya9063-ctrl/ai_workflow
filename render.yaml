services:
  - type: web
    name: ai-workflow-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./storage/ai_workflow.db
      - key: STORAGE_ROOT
        value: ./storage
      - key: FRONTEND_ORIGIN
        value: https://ai-workflow.vercel.app
      - key: DEFAULT_MOCK_PROVIDER
        value: Mock Provider
      - key: REQUEST_TIMEOUT_SECONDS
        value: 180
      - key: PROVIDER_RETRY_MAX_ATTEMPTS
        value: 5
      - key: PROVIDER_RETRY_BASE_DELAY_SECONDS
        value: 1
      - key: PROVIDER_RETRY_MAX_DELAY_SECONDS
        value: 8
