<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>灵改流</title>
    <style>
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        place-items: center;
        background: #f8fafc;
        color: #0f172a;
        font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
      }
      .panel {
        width: 420px;
        padding: 34px;
        border: 1px solid #dbe3ef;
        border-radius: 12px;
        background: white;
        box-shadow: 0 18px 45px rgba(15, 23, 42, 0.08);
      }
      h1 {
        margin: 0 0 10px;
        font-size: 28px;
      }
      p {
        margin: 0;
        line-height: 1.8;
        color: #64748b;
      }
      .bar {
        margin-top: 24px;
        height: 6px;
        overflow: hidden;
        border-radius: 999px;
        background: #e2e8f0;
      }
      .bar::before {
        content: "";
        display: block;
        width: 42%;
        height: 100%;
        border-radius: inherit;
        background: #2563eb;
        animation: loading 1.2s ease-in-out infinite alternate;
      }
      @keyframes loading {
        from { transform: translateX(-40%); }
        to { transform: translateX(180%); }
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>灵改流</h1>
      <p>正在启动本地工作流引擎和桌面界面...</p>
      <div class="bar"></div>
    </div>
  </body>
</html>
